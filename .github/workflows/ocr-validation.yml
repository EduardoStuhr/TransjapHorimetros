name: Validate Transjap Horimetros

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          # Disposable CI container credential, never a production secret.
          MSSQL_SA_PASSWORD: IntegrationOnly!2026
        ports:
          - 1433:1433
    env:
      TEST_SQLSERVER_CONNECTION_STRING: Server=127.0.0.1,1433;Database=transjap_horimetros_tests;User Id=sa;Password=IntegrationOnly!2026;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore apps/api/TransjapHorimetros.sln
      - run: dotnet build apps/api/TransjapHorimetros.sln --configuration Release --no-restore
      - run: dotnet test apps/api/TransjapHorimetros.sln --configuration Release --no-build --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: apps/api/tests/**/TestResults/*.trx
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Inspect utilization reports in Chrome with synthetic data
        run: |
          python -m pip install playwright==1.58.0 openpyxl pymupdf
          python scripts/validation/fase14_fixture.py > /tmp/fixture.log 2>&1 &
          API_URL=http://127.0.0.1:4319 npm start -- --hostname 127.0.0.1 -p 4320 > /tmp/next.log 2>&1 &
          curl --retry 20 --retry-all-errors -sS http://127.0.0.1:4320/login -o /dev/null
          python scripts/validation/fase14_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase14-inspecao
          path: evidence/
