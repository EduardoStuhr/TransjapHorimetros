services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: transjap_sqlserver
    restart: unless-stopped
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Defina SQLSERVER_PASSWORD no arquivo .env}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  sqlserver_data:
    driver: local
